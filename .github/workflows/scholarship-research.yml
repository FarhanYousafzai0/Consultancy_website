name: Research scholarships

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: scholarship-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/research-scholarships.ts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_RESEARCH_PROVIDER: google
          AI_RESEARCH_GOOGLE_MODEL: gemini-3.5-flash-lite
          AI_RESEARCH_OPENAI_MODEL: gpt-4o-mini
